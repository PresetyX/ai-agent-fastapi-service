name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint e testes (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Instalar dependências
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Testes
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=90

  docker:
    name: Build e smoke test da imagem Docker
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build -t ai-agent-fastapi-service:ci .

      - name: Smoke test (health público, CRUD exige token)
        run: |
          docker run -d --name api -p 8000:8000 -e JWT_SECRET=ci-secret-with-at-least-32-bytes-ok ai-agent-fastapi-service:ci
          for i in $(seq 1 20); do curl -fs http://localhost:8000/health && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/workflows)" = "401"
          docker rm -f api
